title: About Me
description: A bit more about my journey as a full‑stack engineer and how I build scalable, user‑centric products.
profileImage:
  src: /avatars/profile-image-2.png
  alt: Sean Erick C. Ramones
content: |
  Hi, I'm **Sean Erick Ramones**, an AI-augmented full‑stack software engineer with over 7 years of experience building modern, performant web applications.

  I focus on turning complex ideas into elegant, scalable products — pairing deep frontend craft (**Vue 3**, **Nuxt**, **React**, **Next.js**), backend systems work (**Node.js**, **FastAPI**), headless CMS (**Strapi**, **Nuxt Content**), containerization (**Docker**), data (**PostgreSQL/Supabase**), and serverless deploys (**Vercel**, **Cloudflare**) with agentic AI tooling: **Claude Code**, **MCP**, the **Claude Agent SDK**, and the **Anthropic API**. Most of my hands-on manual work now flows through AI hand-offs while I drive architecture, judgment, and review.

  ### What I care about

  - Type‑safe code and clean architecture
  - Reusable components and design systems
  - Performance, accessibility, and DX
  - CI/CD and code review culture that scales

  ### Selected experience

  - Miller Development AB — Full‑stack Software Engineer (Hybrid, May 2019–Present)
  - BetterTradeOff Ltd. — Frontend Developer (Contract, Apr 2023–Jan 2024)
  - SCI Global Services — Full‑stack Software Developer (Remote, Jun 2018–Apr 2019)

  ### Education

  - **Silliman University** — Bachelor of Science in Information Technology (2014–2018), Dumaguete City
    - Thesis: digital restaurant ordering system to improve order accuracy and speed for local food businesses.

  ### Languages

  - **English** — Fluent
  - **Filipino / Cebuano** — Native

  ### Beyond the code

  - **Brewing coffee** — espresso and pour-over (with my terrible latte art)
  - **Pickleball** — current trending sport got me hooked
  - **Running** — sometimes jogging, sometimes walking
  - **Free diving** — mostly coastal areas near me
  - **Road-trips and traveling** — sea/coastal or the mountains
  - Cross‑fit training
  - Watching anime; reading Japanese manga/light novels
  - Playing MOBA games (**Dota 2**) and relaxing games (**Stardew Valley**)

  If you’d like to collaborate, reach me at **seancramones@gmail.com** or connect on [LinkedIn](https://www.linkedin.com/in/sean-erick-ramones-102a64192).
