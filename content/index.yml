aiWorkflows:
  title: AI-Augmented Workflows
  description: Agentic tooling paired with engineering judgment, not a replacement for it. I drive the architecture and review, and AI speeds up the delivery cycle.
  heading: How I ship faster
  headingAccent: without cutting corners.
  items:
    - title: Agentic delivery with Claude Code & Claude Design
      description: I use Claude Design to prototype UI ideas and translate draft designs into component structure, then hand off implementation, refactors, and test scaffolding to Claude Code — driving architecture and review while AI compresses the delivery cycle.
      tools:
        - Claude Code
        - Claude Design
      icon: i-simple-icons-anthropic
      link: https://claude.com/product/overview
    - title: MCP servers for project context
      description: Custom MCP servers — including Figma MCP, Notion MCP, and Slack MCP — expose design tokens, component specs, project schemas, internal docs, and team context directly to AI tools, so suggestions stay grounded in the actual codebase, design system, and project reality — not generic patterns.
      tools:
        - MCP
        - Figma MCP
        - Notion MCP
        - Slack MCP
        - TypeScript
      icon: i-lucide-server
      link: https://www.figma.com/ai/our-approach/
    - title: Anthropic API in production
      description: Claude-powered features wired into real Vue/Nuxt and FastAPI backends — structured outputs, tool use, and prompt caching tuned for production.
      tools:
        - Anthropic API
        - Claude Agent SDK
      icon: i-lucide-sparkles
      link: https://code.claude.com/docs/en/agent-sdk/overview
