testimonials:
  title: Testimonials
  description: Feedback from colleagues and clients.
  items:
    - quote: |
        I’ve had the pleasure of working with Sean for four years. During that time, he’s been my go-to person whenever I have questions about frontend development. While I’ve been more focused on backend work, I’ve always admired how proficient Sean is with frontend technologies and how he consistently stays up to date with the latest tools and best practices.

        Sean is easy to work with, approachable, and always willing to help. He explains things clearly and patiently, making collaboration smooth and productive. He brings both technical skill and a great attitude to the team, which makes him a valuable teammate and a great person to work with.

        I highly recommend Sean to any team looking for a skilled frontend developer who’s not only technically strong but also genuinely collaborative and supportive.
      author:
